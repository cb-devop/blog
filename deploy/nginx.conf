# Nginx site configuration for PremiumBlog
# Copy to /etc/nginx/sites-available/premiumblog, then:
#   sudo ln -s /etc/nginx/sites-available/premiumblog /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace example.com with your actual domain(s).
# Run `sudo certbot --nginx` afterwards to add HTTPS automatically.

# --- Frontend: blog.example.com -> :3000 ---
server {
    listen 80;
    server_name blog.example.com;

    client_max_body_size 20M;

    # Allow long requests (AI generation, file uploads)
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Long-lived cache for compiled Next.js assets
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# --- Admin: admin.example.com -> :3001 ---
